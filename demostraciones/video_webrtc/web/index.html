<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="video_webrtc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>video_webrtc</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Captura y grabación del stream WebRTC — usadas desde Dart via JS Interop -->
  <script>
    let _droneRecorder = null;
    let _droneChunks   = [];

    // Captura el frame actual del <video> WebRTC y lo descarga como PNG
    window.captureDroneFrame = function(filename) {
      const video = document.querySelector('video');
      if (!video) { console.warn('captureDroneFrame: no hay elemento video'); return; }
      const canvas = document.createElement('canvas');
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const a = document.createElement('a');
      a.href     = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
    };

    // Inicia grabación del stream como WebM
    window.startDroneRecording = function() {
      const video = document.querySelector('video');
      if (!video) { console.warn('startDroneRecording: no hay elemento video'); return; }
      const stream = video.captureStream
        ? video.captureStream(30)
        : video.mozCaptureStream(30);
      _droneChunks   = [];
      _droneRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      _droneRecorder.ondataavailable = e => {
        if (e.data.size > 0) _droneChunks.push(e.data);
      };
      _droneRecorder.start(100); // recoge chunks cada 100ms
      console.log(' Grabación iniciada');
    };

    // Para la grabación y descarga el .webm
    window.stopDroneRecording = function(filename) {
      if (!_droneRecorder) { console.warn('stopDroneRecording: no hay grabación activa'); return; }
      _droneRecorder.onstop = () => {
        const blob = new Blob(_droneChunks, { type: 'video/webm' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        console.log(' Vídeo guardado:', filename);
      };
      _droneRecorder.stop();
    };
  </script>
</body>
</html>
