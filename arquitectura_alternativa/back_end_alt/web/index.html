<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EZDRONE</title>

  <script>
    // ------- IMU bridge — DeviceOrientationEvent ----------
    var _alpha = 0, _beta = 0, _gamma = 0;

    function requestMotionPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(function (result) {
            if (result === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(event) {
      _alpha = event.alpha || 0;
      _beta = event.beta || 0;
      _gamma = event.gamma || 0;
    }

    function getAlpha() { return _alpha; }
    function getBeta() { return _beta; }
    function getGamma() { return _gamma; }

    function stopOrientation() {
      window.removeEventListener('deviceorientation', handleOrientation);
    }


    // ------------ Galería — almacenamiento en IndexedDB ---------------
    // Cada registro: {id, type:'photo'|'video', mime, filename, timestamp, blob}
    // Los object URLs se cachean en window._ezMediaUrls para acceso síncrono.
    window._ezMediaUrls = {};
    const _EZ_DB = 'ezdrone_media', _EZ_STORE = 'media';

    function _ezOpenDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(_EZ_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(_EZ_STORE)) {
            db.createObjectStore(_EZ_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function _ezPutMedia(record) {
      _ezOpenDb().then(db => {
        const tx = db.transaction(_EZ_STORE, 'readwrite');
        tx.objectStore(_EZ_STORE).put(record);
        if (record.blob) {
          window._ezMediaUrls[record.id] = URL.createObjectURL(record.blob);
        }
      }).catch(e => console.error('IndexedDB put:', e));
    }

    // Recorre todos los registros, recrea los object URLs y devuelve la
    // metadata (sin blobs) como JSON string.
    window.ezInitMediaStore = function () {
      return _ezOpenDb().then(db => new Promise((resolve) => {
        const tx = db.transaction(_EZ_STORE, 'readonly');
        const req = tx.objectStore(_EZ_STORE).getAll();
        req.onsuccess = () => {
          const meta = (req.result || []).map(r => {
            if (r.blob && !window._ezMediaUrls[r.id]) {
              window._ezMediaUrls[r.id] = URL.createObjectURL(r.blob);
            }
            return { id: r.id, type: r.type, mime: r.mime, filename: r.filename, timestamp: r.timestamp };
          });
          resolve(JSON.stringify(meta));
        };
        req.onerror = () => resolve('[]');
      })).catch(() => '[]');
    };

    window.ezGetMediaUrl = function (id) {
      return window._ezMediaUrls[id] || '';
    };

    window.ezDeleteMedia = function (id) {
      const url = window._ezMediaUrls[id];
      if (url) { URL.revokeObjectURL(url); delete window._ezMediaUrls[id]; }
      _ezOpenDb().then(db => {
        db.transaction(_EZ_STORE, 'readwrite').objectStore(_EZ_STORE).delete(id);
      }).catch(e => console.error('IndexedDB delete:', e));
    };

    // Guarda en la galería un medio recibido como base64 (p.ej. la panorámica
    // 360 que cose la estación de tierra y envía por MQTT). Reconstruye el Blob
    // y reutiliza _ezPutMedia (mismo store + object URL que fotos/vídeos).
    window.ezPutMediaBytes = function (id, type, mime, filename, base64) {
      try {
        const bin = atob(base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: mime });
        _ezPutMedia({ id, type, mime, filename, timestamp: Date.now(), blob });
      } catch (e) {
        console.error('ezPutMediaBytes:', e);
      }
    };

    // ------------ Visor 360 interactivo (Three.js) -------------------
    // Porta visor_panorama360.py: abre la panorámica de la galería en una vista
    // cilíndrica arrastrable (drag = girar 360º, rueda = zoom). Usa el object URL
    // (blob:) ya cacheado; la ventana hija es del mismo origen y puede leerlo.
    window.openPanoramaViewer = function (id) {
      const url = window._ezMediaUrls[id];
      if (!url) { console.warn('openPanoramaViewer: sin imagen para', id); return; }
      const w = window.open('', '_blank');
      if (!w) { console.warn('openPanoramaViewer: popup bloqueado'); return; }
      const html = [
        '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">',
        '<meta name="viewport" content="width=device-width, initial-scale=1">',
        '<title>Panorama 360 del dron</title><style>',
        'html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif;}',
        '#c{display:block;width:100vw;height:100vh;cursor:grab;}#c:active{cursor:grabbing;}',
        '#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#eee;',
        'background:rgba(0,0,0,.45);padding:8px 14px;border-radius:20px;font-size:13px;',
        'pointer-events:none;transition:opacity .6s;}',
        '#close{position:fixed;top:12px;right:14px;z-index:10;display:flex;',
        'align-items:center;justify-content:center;width:38px;height:38px;',
        'border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px;',
        'line-height:1;cursor:pointer;user-select:none;}',
        '#close:hover{background:rgba(0,0,0,.8);}</style></head><body>',
        '<canvas id="c"></canvas>',
        '<div id="close" title="Cerrar (Esc)">&times;</div>',
        '<div id="hint">Arrastra para girar 360&deg; &middot; rueda para acercar</div>',
        '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>',
        '<script>',
        'function _closeViewer(){ try{ window.close(); }catch(e){} ',
        '  if(!window.closed && window.history.length>1){ window.history.back(); } }',
        'document.getElementById("close").addEventListener("click", _closeViewer);',
        'addEventListener("keydown", function(e){ if(e.key==="Escape") _closeViewer(); });',
        'var IMG = "' + url + '";',
        'var scene = new THREE.Scene();',
        'var camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);',
        'var renderer = new THREE.WebGLRenderer({canvas: document.getElementById("c"), antialias:true});',
        'renderer.setSize(innerWidth, innerHeight);',
        'renderer.setPixelRatio(Math.min(devicePixelRatio, 2));',
        'var lon=0, lat=0, targetLon=0, targetLat=0;',
        'new THREE.TextureLoader().load(IMG, function(tex){',
        '  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = THREE.RepeatWrapping;',
        '  var w = tex.image.width, h = tex.image.height, r = 5;',
        '  var height = 2*Math.PI*r*(h/w);',
        '  var geo = new THREE.CylinderGeometry(r, r, height, 120, 1, true);',
        '  geo.scale(-1, 1, 1);',
        '  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: tex})));',
        '});',
        'var dragging=false, px=0, py=0; var el = renderer.domElement;',
        'el.addEventListener("pointerdown", function(e){ dragging=true; px=e.clientX; py=e.clientY; });',
        'addEventListener("pointerup", function(){ dragging=false; });',
        'addEventListener("pointermove", function(e){ if(!dragging) return;',
        '  targetLon -= (e.clientX-px)*0.15; targetLat += (e.clientY-py)*0.12;',
        '  targetLat = Math.max(-55, Math.min(55, targetLat)); px=e.clientX; py=e.clientY;',
        '  var hint=document.getElementById("hint"); if(hint) hint.style.opacity=0; });',
        'el.addEventListener("wheel", function(e){ e.preventDefault();',
        '  camera.fov = Math.max(35, Math.min(95, camera.fov + e.deltaY*0.03));',
        '  camera.updateProjectionMatrix(); }, {passive:false});',
        'addEventListener("resize", function(){ camera.aspect = innerWidth/innerHeight;',
        '  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });',
        '(function animate(){ requestAnimationFrame(animate);',
        '  lon += (targetLon-lon)*0.1; lat += (targetLat-lat)*0.1;',
        '  var phi = THREE.MathUtils.degToRad(90-lat), theta = THREE.MathUtils.degToRad(lon);',
        '  camera.lookAt(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));',
        '  renderer.render(scene, camera); })();',
        '<\/script></body></html>'
      ].join('\n');
      w.document.open();
      w.document.write(html);
      w.document.close();
    };

    // ------------ Captura y grabación del stream WebRTC ---------------
    let _droneRecorder = null;
    let _droneChunks = [];

    window.captureDroneFrame = function (id, filename) {
      const video = document.querySelector('video');
      if (!video) { console.warn('captureDroneFrame: no hay elemento video'); return; }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);
      // Descarga al navegador (comportamiento original)
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
      // Persiste en IndexedDB para la galería
      canvas.toBlob(blob => {
        if (blob) _ezPutMedia({ id, type: 'photo', mime: 'image/png', filename, timestamp: Date.now(), blob });
      }, 'image/png');
    };

    window._droneStream = null;

    window.startDroneRecording = function () {
      const stream = window._droneStream || (() => {
        const video = document.querySelector('video');
        if (!video) return null;
        return video.captureStream ? video.captureStream() :
          video.mozCaptureStream ? video.mozCaptureStream() : null;
      })();

      if (!stream) {
        console.warn('startDroneRecording: no hay stream disponible');
        return;
      }

      // iOS Safari graba MP4 nativo, Chrome graba WebM
      let mimeType = '';
      if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
        mimeType = 'video/mp4;codecs=avc1';
      } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
        mimeType = 'video/webm;codecs=vp8';
      } else {
        mimeType = 'video/webm';
      }

      window._droneRecordingMimeType = mimeType;
      _droneChunks = [];

      try {
        _droneRecorder = new MediaRecorder(stream, { mimeType });
        _droneRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) _droneChunks.push(e.data);
        };
        _droneRecorder.start(200);
        console.log('Grabación iniciada:', mimeType);
      } catch (e) {
        console.error('Error al iniciar MediaRecorder:', e);
      }
    };

    window.stopDroneRecording = function (id, filename) {
      if (!_droneRecorder) { console.warn('stopDroneRecording: no hay grabación activa'); return; }
      _droneRecorder.onstop = () => {
        const mime = window._droneRecordingMimeType || 'video/webm';
        const isNativeMp4 = mime.includes('mp4');
        const blob = new Blob(_droneChunks, { type: mime });
        const dlName = isNativeMp4 ? filename : filename.replace('.mp4', '.webm');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        // iOS: descarga como .mp4 real — Chrome: descarga como .webm
        a.download = dlName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        // Persiste en IndexedDB para la galería (object URL propio, no se revoca)
        _ezPutMedia({ id, type: 'video', mime, filename: dlName, timestamp: Date.now(), blob });
      };
      _droneRecorder.stop();
    };


    // ------------------ Fullscreen -------------
    window.requestFullscreenEZ = function () {
      if (/iPhone|iPad/i.test(navigator.userAgent)) return;
      const el = document.documentElement;
      const fn = el.requestFullscreen
        || el.webkitRequestFullscreen
        || el.mozRequestFullScreen
        || el.msRequestFullscreen;
      if (fn) fn.call(el).catch(function () { });
    };

    window.exitFullscreenEZ = function () {
      const el = document.fullscreenElement
        || document.webkitFullscreenElement
        || document.mozFullScreenElement
        || document.msFullscreenElement;
      if (!el) return;
      const fn = document.exitFullscreen
        || document.webkitExitFullscreen
        || document.mozCancelFullScreen
        || document.msExitFullscreen;
      if (fn) fn.call(document).catch(function () { });
    };

    // --------- Orientation lock helper ------------------
    window.lockOrientationEZ = function (orientation) {
      if (screen.orientation && typeof screen.orientation.lock === 'function') {
        screen.orientation.lock(orientation).catch(function () { });
      }
    };

    window.unlockOrientationEZ = function () {
      if (screen.orientation && typeof screen.orientation.unlock === 'function') {
        try { screen.orientation.unlock(); } catch (e) { }
      }
    };

    // ----------------CSV download ---------------------
    window.downloadCSVEZ = function (filename, content) {
      var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', filename);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };

    // --------- Captura del stream WebRTC para grabación o snapshot -------------
    function setDroneStreamRef() {
      var videos = document.querySelectorAll('video');
      for (var v of videos) {
        if (v.srcObject && v.srcObject.getVideoTracks().length > 0) {
          window._droneStream = v.srcObject;
          break;
        }
      }
    }

  </script>
</head>
